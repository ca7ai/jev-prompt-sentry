[project]
name = "jev-prompt-sentry"
version = "0.1.0"
description = "Ingress prompt-injection firewall backed by TypeSafe Jev"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "typesafe-sdk>=0.7.0",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
bench = [
    "datasets>=3.0",
    # deepset/prompt-injections mixes German and English rows, and the spec
    # requires a per-language breakdown rather than one blended number. py3langid
    # is pure-Python and deterministic: langdetect needs a seed to reproduce.
    "py3langid>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_prompt_sentry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
